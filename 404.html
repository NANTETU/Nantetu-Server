<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | ページが見つかりません 🚧</title>
    <link rel="stylesheet" href="/style.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=RocknRoll+One&family=Noto+Sans+JP:wght@400;700;900&display.swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="scripts/set_base.js"></script>
</head>
<body class="policy-page">

<div id="header-placeholder"></div>
<script src="/_inject_header.js"></script>

    <section id="error404" style="padding-top: 100px; padding-bottom: 100px;">
        <div class="content-wrapper">
            <div class="policy-wrapper" style="text-align: center;">
                <h2 style="margin-bottom: 20px;">404 Not Found</h2>
                <div class="policy-content" style="padding: 50px;">
                    <i class="fas fa-exclamation-triangle" style="font-size: 60px; color: var(--color-secondary); margin-bottom: 20px;"></i>
                    <h3 style="font-size: 28px; color: var(--color-text-dark); margin: 20px 0;">ページが見つかりません</h3>
                    <p style="font-size: 18px; line-height: 1.8; color: var(--color-text-medium);">
                        お探しのURLは移動されたか、削除された可能性があります。<br>
                        お手数ですが、以下のボタンからトップページへお戻りください。
                    </p>
                    <a href="/" class="join-btn" style="margin-top: 30px; font-size: 16px; padding: 12px 30px;">
                        <i class="fas fa-home"></i> トップページに戻る
                    </a>
                </div>
            </div>
        </div>
    </section>

    <script>
        // モバイルメニューの開閉機能は全てのページで必要なので残します
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggle = document.getElementById('menu-toggle');
            const mainNav = document.getElementById('main-nav');
            if (menuToggle && mainNav) {
                menuToggle.addEventListener('click', () => {
                    mainNav.classList.toggle('open');
                    const icon = menuToggle.querySelector('i');
                    if (mainNav.classList.contains('open')) {
                        icon.classList.replace('fa-bars', 'fa-times');
                    } else {
                        icon.classList.replace('fa-times', 'fa-bars');
                    }
                });
                // メニューリンククリックで閉じる
                mainNav.querySelectorAll('a').forEach(link => {
                    link.addEventListener('click', () => {
                        if (window.innerWidth <= 768) {
                            mainNav.classList.remove('open');
                            menuToggle.querySelector('i').classList.replace('fa-times', 'fa-bars');
                        }
                    });
                });
            }
        });
    </script>
	<button id="ai-chat-button" style="position: fixed; bottom: 20px; right: 20px; background-color: #8A2BE2; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer; z-index: 9999; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
    <i class="fas fa-robot"></i>
</button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatButton = document.getElementById('ai-chat-button');
        let chatIframe = null; // iframeのインスタンスを保持

        // チャットウィジェットを開く/閉じる
        chatButton.addEventListener('click', () => {
            if (!chatIframe) {
                // 初回クリック時: iframeを作成
                chatIframe = document.createElement('iframe');
                // 💡 ここも相対パスで指定します
                chatIframe.src = 'ai/ai_widget.html'; 
                chatIframe.id = 'ai-chat-iframe';
                chatIframe.style.cssText = `
                    position: fixed;
                    bottom: 80px; /* ボタンの上に配置 */
                    right: 20px;
                    width: 350px;
                    height: 500px;
                    border: 1px solid #ccc;
                    border-radius: 15px;
                    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
                    z-index: 9998;
                    display: block; /* 作成時は表示 */
                `;
                document.body.appendChild(chatIframe);
            } else {
                // 2回目以降のクリック時: 表示/非表示を切り替え
                const isHidden = chatIframe.style.display === 'none';
                chatIframe.style.display = isHidden ? 'block' : 'none';
            }
        });

        // iframeからのメッセージを受け取る (閉じる処理)
        window.addEventListener('message', (event) => {
            // セキュリティのため、送信元URLをチェックすべきですが、今回はシンプルな実装のため省略
            if (event.data === 'close-ai-widget' && chatIframe) {
                chatIframe.style.display = 'none';
            }
        });
    });
</script>
</body>
</html>

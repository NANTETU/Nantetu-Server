<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>なんてつAIアシスタント</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="widget_style.css">
</head>
<body>

    <div id="chat-container">
        <header id="chat-header">
            <div id="header-content">
                <i class="fas fa-robot"></i>
                <h3>なんてつAIアシスタント</h3>
            </div>
            <button id="close-button"><i class="fas fa-times"></i></button>
        </header>

        <div id="messages">
        </div>

        <form id="input-form">
            <input type="text" id="user-input" placeholder="例: 土地保護のやり方を教えて" required>
            <button type="submit" id="send-button"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <script src="widget_logic.js"></script>
</body>
</html>

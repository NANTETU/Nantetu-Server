<html lang="ja">
<head>

    <style>
/* ========== カラーと基本設定 (V3) ========== */
:root {
    --color-primary: #5E35B1;
    --color-secondary: #FFC107;
    
    --color-bg-base: #f8f9fa;
    --color-bg-alt: #ffffff;
    --color-text-dark: #212529;
    --color-text-medium: #6c757d;
    --color-border: #dee2e6;
    
    --color-discord: #5865F2;
    --color-success: #198754;
    --color-error: #dc3545; /* エラーカラーを追加 */

    --radius-default: 8px;
    --shadow-subtle: 0 4px 12px rgba(0,0,0,0.05);
    --shadow-lift: 0 10px 25px rgba(0,0,0,0.08);
}

/* ナビゲーションのジャンプをなめらかにする */
html {
    scroll-behavior: smooth;
}


/* キーボード操作時のフォーカスカラーをサイトのメインカラーに統一 */
a:focus, button:focus, input:focus, textarea:focus, .quiz-option:focus {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
}

/* 送信完了メッセージのカスタムスタイル (最終版) */
.submission-success-message {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 0;
    border: none;
    border-radius: none;
    background-color: transparent;
}
.submission-success-message h2 {
    font-size: 28px;
    font-weight: 700;
}

/* hiddenクラスの定義を追記 */
.hidden {
    display: none !important;
}

body {
    font-family: 'Noto Sans JP', sans-serif;
    margin: 0;
    background: var(--color-bg-base);
    color: var(--color-text-dark);
    line-height: 1.8;
    overflow-x: hidden;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
}
a { color: var(--color-primary); text-decoration: none; transition: all 0.2s ease; }
a:hover { color: #4527a0; }

/* ========== ナビゲーションバー (V3) ========== */
.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;
    background-color: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    box-shadow: none;
    border-bottom: 1px solid var(--color-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 40px;
}
.navbar .logo-link {
    text-decoration: none;
    color: var(--color-text-dark);
    cursor: pointer;
    display: flex;
}
.navbar .logo-link:hover {
    opacity: 0.8;
}
.navbar .logo {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: 26px;
    color: var(--color-primary);
}
.navbar .nav-links a {
    color: var(--color-text-dark);
    font-weight: 700;
    font-size: 15px;
    padding: 8px 12px;
    border-radius: 6px;
    transition: all 0.2s ease-in-out;
}
.navbar .nav-links a:hover {
    color: var(--color-primary);
    background: rgba(94, 53, 177, 0.05);
}
/* ▼ news.html で 'ニュース' をアクティブにするスタイル */
.navbar .nav-links a[href="news.html"] {
    color: var(--color-primary);
    background: rgba(94, 53, 177, 0.05);
}
.discord-nav-btn {
    padding: 8px 15px;
    background: var(--color-discord);
    color: white !important;
    border-radius: var(--radius-default);
    font-weight: 700 !important;
    font-size: 15px;
    transition: all 0.3s;
}
.discord-nav-btn:hover {
    background: #6D77F9;
    box-shadow: 0 4px 10px rgba(88, 101, 242, 0.2);
}

/* モバイルメニューのトグルボタン */
.menu-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 24px;
    color: var(--color-primary);
    cursor: pointer;
    padding: 0;
    z-index: 1006; /* ボタンが最前面にくるように */
}

/* ========== ヘッダー (V4 - 画像実装) ========== */
header {
    position: relative;
    text-align: center;
    padding: 100px 20px 100px;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.6)),
                url('banner.jpg') no-repeat center center;
    background-size: cover;
    background-position: center top; /* 上端を基準に画像を配置 */
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5); /* 文字を見やすく */
    box-shadow: none;
    margin-bottom: 0;
}
header h1 {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    font-size: 58px; 
    margin: 0;
}
header p {
    font-size: 20px;
    opacity: 0.9;
    margin-bottom: 40px;
    font-weight: 400;
}

/* ========== CTAボタン (V3) ========== */
.action-btn, .submit-btn, .join-btn {
    display: inline-block;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 50px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    cursor: pointer;
    border: none;
    box-shadow: var(--shadow-subtle);
}
.join-btn {
    background: var(--color-secondary);
    color: var(--color-text-dark);
}
.join-btn:hover {
    background: #FFD550;
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
}
.secondary-btn {
    background: rgba(255, 255, 255, 0.95);
    color: var(--color-primary);
    border: 1px solid #fff;
    box-shadow: none;
    border-radius: var(--radius-default); /* ボタンの角を丸くする */
    padding: 12px 25px; /* サイズ調整 */
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
.secondary-btn:hover {
    background: #fff;
    transform: translateY(-2px);
    box-shadow: var(--shadow-subtle);
}

/* ========== セクションの基本スタイル (V3) ========== */
section {
    position: relative;
    width: 100%;
    padding: 80px 0;
    box-sizing: border-box;
    border-bottom: 1px solid var(--color-border);
}
/* ▼ ニュースページは背景色を交互にする */
section:nth-child(even) { background: var(--color-bg-base); }
section:nth-child(odd) { background: var(--color-bg-alt); }


.content-wrapper { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

/* ▼ ニュースリスト用に幅を狭めるコンテナ */
.news-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
}

h2 {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 900;
    color: var(--color-text-dark);
    padding-bottom: 15px;
    margin-bottom: 50px;
    font-size: 38px;
    text-align: center;
    position: relative;
}
h2::after {
    content: '';
    display: block;
    width: 70px;
    height: 4px;
    background: var(--color-primary);
    border-radius: 2px;
    margin: 15px auto 0;
}
h3 {
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    color: var(--color-primary);
    font-size: 24px;
    margin-top: 30px;
}
        
/* ========== ▼ ニュースページ専用のスタイル (indexデザインに統合) ========== */
.news-item {
    background-color: var(--color-bg-alt);
    padding: 25px 30px;
    border-radius: 12px; /* 角丸を少し大きく */
    margin-bottom: 25px;
    border-left: 5px solid var(--color-secondary);
    box-shadow: var(--shadow-subtle);
    transition: transform 0.2s, box-shadow 0.2s;
}
.news-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-lift);
}
.news-item h3 {
    color: var(--color-text-dark);
    font-size: 22px;
    margin-top: 0;
    margin-bottom: 5px;
}
.news-item .news-date {
    display: block;
    color: var(--color-text-medium);
    font-size: 14px;
    margin-bottom: 15px; /* 日付と本文の間隔を空ける */
}
.news-item p {
    line-height: 1.8; /* 標準の行間に合わせる */
    color: var(--color-text-dark);
    white-space: pre-wrap; /* 改行を反映 */
    margin-bottom: 0; /* pタグの最後のマージンを削除 */
}
/* ▼ エラー表示用のスタイル */
.news-item.error-item {
    border-left-color: var(--color-error);
    background-color: #fef2f2;
}
.news-item.loading-item {
    text-align: center;
    color: var(--color-text-medium);
    border-left-color: var(--color-border);
    box-shadow: none;
}
/* ========== ▲ ニュースページ専用のスタイル ========== */

/* ========== フッター ========== */
footer {
    text-align: center;
    padding: 30px 0;
    background-color: var(--color-text-dark);
    color: #cccccc;
    font-size: 14px;
}
footer a {
    color: #ffffff;
    text-decoration: none;
    margin: 0 10px;
}

/* ========== モバイルCSS (768px以下) ========== */
@media (max-width: 768px) {
    .navbar .content-wrapper { padding: 0 15px; }
    .navbar .logo { font-size: 22px; }
    
    .menu-toggle { display: block; } /* モバイルメニューボタンを表示 */
    .navbar .nav-links { display: none !important; }

    /* モバイルメニューのスタイル */
    nav#main-nav {
        display: none;
        position: fixed;
        top: 60px; 
        right: 0;
        left: 0;
        width: 100%;
        background-color: var(--color-bg-alt);
        box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        flex-direction: column;
        padding: 10px 0;
        transition: transform 0.3s ease-out; 
        transform: translateY(-100%);
        z-index: 1005; /* 最前面 */
    }
    nav#main-nav.open {
        display: flex;
        transform: translateY(0);
    }
    nav#main-nav a {
        padding: 12px 20px;
        text-align: left;
        width: 100%;
        border-bottom: 1px solid var(--color-border);
    }
    nav#main-nav a:last-child { border-bottom: none; }
    
    header { padding: 80px 20px 80px; }
    header h1 { font-size: 38px; }
    header p { font-size: 16px; }

    h2 { font-size: 32px; margin-bottom: 30px; }
    h3 { font-size: 20px; }
    
    .news-item {
        padding: 20px;
    }
}
    </style>
</head>
<body id="top">

    <nav class="navbar">
        <div class="content-wrapper" style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 20px;">
            <a href="index.html" class="logo-link">
                <div class="logo">なんてつサーバー</div>
            </a>
            
            <button class="menu-toggle" id="menu-toggle" aria-label="メニューを開く">
                <i class="fas fa-bars"></i>
            </button>

            <nav id="main-nav" class="nav-links">
                <a href="index.html"><i class="fas fa-home"></i> トップ</a>
                <a href="index.html#about"><i class="fas fa-info-circle"></i> 概要</a>
                <a href="index.html#rules-accordion">ルール</a>
                <a href="command.html">コマンド一覧</a>
				<a href="guide.html">ガイド</a>
				<a href="news.html"><i class="fas fa-bullhorn"></i> お知らせ</a>
                <a href="index.html#contact">お問い合わせ</a>
                <a href="https://discord.gg/79H7Jy65nz" class="discord-nav-btn">Discordに参加</a>
            </nav>
            </div>
    </nav>
    <header id="hero" style="padding-top: 80px; padding-bottom: 80px; background: linear-gradient(135deg, rgba(94, 53, 177, 0.7), rgba(0, 0, 0, 0.5)), url('banner.jpg') no-repeat center center; background-size: cover;">
        <div class="content-wrapper">
            <h1 style="font-size: 42px;"><i class="fas fa-bullhorn"></i> サーバーニュース</h1>
            <p style="margin-bottom: 0;">最新のお知らせを自動で表示しています。</p>
        </div>
    </header>
    <section id="news-content" class="content-section">
        <div class="news-wrapper" id="news-list">
            <div class="news-item loading-item">
                <p><i class="fas fa-spinner fa-spin"></i> お知らせを読み込み中...</p>
            </div>
        </div>
    </section>
    <footer>
        <div class="content-wrapper">
            <p>&copy; 2025 なんてつサーバー. All rights reserved. | <a href="index.html#contact">お問い合わせ</a> | <a href="privacy.html">プライバシーポリシー</a> | <a href="terms.html">利用規約</a></p>
        </div>
    </footer>
<script>
        // ★★★ 修正箇所1: URL末尾のスペースを削除し、async functionで囲む ★★★
        const GAS_WEB_APP_URL = '/api/news; 

        const newsListContainer = document.getElementById('news-list');

        function formatDiscordContent(content) {
            // スプレッドシートの内容にDiscordマークダウンが含まれていると想定して変換
            let formatted = content;
            // HTMLタグをエスケープ (XSS対策)
            formatted = formatted.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
            
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); // 太字
            formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>'); // 斜体
            formatted = formatted.replace(/^(#+)\s*(.*)/gm, (match, hashes, text) => `<h${hashes.length + 3}>${text}</h${hashes.length + 3}>`); // 見出し
            formatted = formatted.replace(/```([\s\S]*?)```/gs, (match, code) => `<pre style="background: #eee; padding: 10px; border-radius: 5px; white-space: pre-wrap; word-break: break-all;">${code}</pre>`); // コードブロック

            return formatted;
        }
        
        function formatNewsDate(timestamp) {
            // スプレッドシートから取得したタイムスタンプを整形
            const date = new Date(timestamp);
            const options = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Tokyo' };
            return date.toLocaleDateString('ja-JP', options);
        }

        // ★★★ 修正箇所2: fetchAndRenderNews 関数を定義する ★★★
        async function fetchAndRenderNews() {

            // URLにスペースがないかチェックする処理は、削除されているため再追加しません。
            // URLが正しく設定されている前提で進めます。

            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const newsData = await response.json();

                // 読み込み中のメッセージを削除
                newsListContainer.innerHTML = ''; 

                if (newsData.error) {
                    // GAS側でエラーが発生した場合
                    newsListContainer.innerHTML = `
                        <div class="news-item error-item">
                            <h3>データ取得エラー</h3>
                            <p>${newsData.error} (${newsData.status || ''})</p>
                            <p>GASのデプロイ設定やスプレッドシートのIDを確認してください。</p>
                        </div>
                    `;
                    return;
                }

                if (newsData.length === 0) {
                    newsListContainer.innerHTML = `
                        <div class="news-item">
                            <h3>現在新しいお知らせはありません</h3>
                            <p>新しいアップデートやイベント情報は、Googleフォームから投稿してください。</p>
                        </div>
                    `;
                    return;
                }

                // ニュースアイテムをHTMLに変換して挿入
                newsData.forEach(item => {
                    const newsItemDiv = document.createElement('div');
                    newsItemDiv.className = 'news-item';
                    
                    // スプレッドシートの {title, content, author} を取得
                    const title = item.title || 'タイトルなし'; 
                    const formattedContent = formatDiscordContent(item.content || ''); // contentがnullの場合も考慮
                    const author = item.author || '運営'; // ⬅️ 投稿者名
                    const formattedDate = formatNewsDate(item.timestamp);
                    
                    newsItemDiv.innerHTML = `
                        <h3>${title}</h3> 
                        <span class="news-date">投稿者: ${author} | ${formattedDate}</span>
                        <p>${formattedContent}</p>
                        `;
                    newsListContainer.appendChild(newsItemDiv);
                });

            } catch (error) {
                console.error('ニュース取得エラー:', error);
                newsListContainer.innerHTML = `
                    <div class="news-item error-item">
                        <h3>接続エラー</h3>
                        <p>ニュースの自動取得に失敗しました。GASのURLが正しいか、またはネットワーク接続を確認してください。</p>
                        <p><small>${error}</small></p>
                    </div>
                `;
            }
        } // <- ここで fetchAndRenderNews 関数の定義を閉じる

    document.addEventListener('DOMContentLoaded', function() {
        
        // ページロード時にニュースの取得を開始
        fetchAndRenderNews();

        // モバイルメニューの開閉機能
        const menuToggle = document.getElementById('menu-toggle');
        const mainNav = document.getElementById('main-nav');

        if (menuToggle && mainNav) {
            menuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('open');
                const icon = menuToggle.querySelector('i');
                if (mainNav.classList.contains('open')) {
                    icon.classList.replace('fa-bars', 'fa-times');
                } else {
                    icon.classList.replace('fa-times', 'fa-bars');
                }
            });

            // メニューを開いた状態でリンクをクリックしたら閉じる (スムーズスクロールと連携)
            mainNav.querySelectorAll('a').forEach(link => {
                link.addEventListener('click', () => {
                    // 画面幅がモバイルサイズ（768px以下）の場合のみ閉じる
                    if (window.innerWidth <= 768) { 
                        mainNav.classList.remove('open');
                        menuToggle.querySelector('i').classList.replace('fa-times', 'fa-bars');
                    }
                });
            });
        }
    });
    </script>
</body>

</html>
